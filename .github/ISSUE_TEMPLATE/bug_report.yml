name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请删除 API Key、书籍正文和个人信息后再提交。
  - type: input
    id: device
    attributes:
      label: Kindle 型号与 KOReader 版本
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: AI 服务与模型
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已清除隐私信息的日志
      render: text
